<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <h2>Cliente Servicio Contrato</h2>

    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/clienteserviciocontrato}" method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Fecha Alta</label>

                <div class="col-sm-10">
                    <input type="date" class="form-control" th:field="*{fechaalta}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Fecha Baja</label>
                <div class="col-sm-10">
                    <input type="date" class="form-control" th:field="*{fechabaja}"/>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-2 control-label">
                    <label>Cliente</label>
                </div>
                <div class="col-sm-10">
                    <select class="form-control"
                            th:field="*{cliente}">
                        <option value="">
                            Seleccione un cliente
                        </option>
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.id}"
                                th:text="${cliente.nombre + ' ' + cliente.apellido}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-2 control-label">
                    <label>Servicio</label>
                </div>
                <div class="col-sm-10">
                    <select class="form-control"
                            th:field="*{servicio}">
                        <option value="">
                            Seleccione un servicio
                        </option>
                        <option th:each="servicio : ${servicios}"
                                th:value="${servicio.id}"
                                th:text="${servicio.descrip}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="row">
                <button type="submit"
                        class="btn btn-success">
                    Guardar
                </button>
                <a class="btn btn-default"
                   th:href="@{/clienteserviciocontrato/refresh}">
                    Cancelar
                </a>
            </div>

            <h5 style="color:red;" th:text="${message}"></h5>

        </form>
    </div>

</div>

</body>
</html>
